name: EAS Build & Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile to run'
        required: false
        default: 'preview'

jobs:
  update:
    name: Publish OTA update (instant, no store review)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - run: eas update --branch main --message "${{ github.event.head_commit.message }}" --non-interactive

  build:
    name: EAS Build (native binaries)
    runs-on: ubuntu-latest
    # Native builds are slower/rate-limited — only run on manual trigger,
    # or automatically whenever a commit message contains "[build]".
    if: contains(github.event.head_commit.message, '[build]') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - run: eas build --platform all --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
